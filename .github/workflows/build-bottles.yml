name: Build bottles

on:
  pull_request:
  workflow_dispatch:
    inputs:
      formulae:
        description: Comma-separated formulae to bottle (defaults to all)
        required: false

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: macos-15-intel
          - os: macos-26
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - run: brew test-bot --only-setup
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Select formulae
        id: formulae
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          REQUESTED_FORMULAE: ${{ inputs.formulae }}
        run: |
          brew ruby -- scripts/bottle_workflow.rb select-formulae \
            --event "$GITHUB_EVENT_NAME" \
            --base-ref "$GITHUB_BASE_REF" \
            --requested "$REQUESTED_FORMULAE" \
            --output "$GITHUB_OUTPUT"

      - name: Build bottles
        if: steps.formulae.outputs.value != ''
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          FORMULAE: ${{ steps.formulae.outputs.value }}
        run: |
          brew ruby -- scripts/bottle_workflow.rb build-bottles \
            --formulae "$FORMULAE" \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: ${{ steps.set-up-homebrew.outputs.repository-path }}/*.bottle.*
